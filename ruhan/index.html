<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="Ruhan Tahlil Islam Britto — front-end web developer portfolio, a 3D desk scene at night." />
<title>Ruhan Tahlil Islam Britto — Front-End Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <a class="skip-link" href="#hero">Skip to content</a>

  <!-- The 3D scene renders here. Purely decorative — every word on this
       page lives in real HTML below, not inside the canvas. -->
  <canvas id="scene-canvas" aria-hidden="true"></canvas>
  <div id="fallback-bg" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" id="brand-name" href="#hero">Loading…</a>
    <nav class="site-nav" aria-label="Section links">
      <a href="#projects" class="nav-primary">Projects</a>
      <a href="#contact" class="nav-primary">Contact</a>
      <button id="skip3d-btn" type="button" aria-pressed="false">Skip 3D</button>
    </nav>
  </header>

  <main id="main">

    <section id="hero" class="stop" tabindex="-1">
      <div class="panel">
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-title" id="hero-title"></p>
        <p class="hero-line" id="hero-line"></p>
        <div class="hero-actions">
          <a class="btn primary" href="#projects">See projects</a>
          <a class="btn" href="#contact">Get in touch</a>
        </div>
      </div>
    </section>

    <section id="about" class="stop">
      <div class="panel">
        <span class="tag-label">about</span>
        <h2>About</h2>
        <p id="about-text"></p>
      </div>
    </section>

    <section id="skills" class="stop">
      <div class="panel">
        <span class="tag-label">skills</span>
        <h2>Skills</h2>
        <ul class="skills-list" id="skills-list"></ul>
      </div>
    </section>

    <section id="projects" class="stop">
      <div class="panel">
        <span class="tag-label">projects</span>
        <h2>Projects</h2>
        <div class="projects-list" id="projects-list"></div>
      </div>
    </section>

    <section id="contact" class="stop">
      <div class="panel">
        <span class="tag-label">contact</span>
        <h2>Contact</h2>
        <ul class="contact-list" id="contact-list"></ul>
      </div>
    </section>

  </main>

  <footer>Built by Ruhan — HTML, CSS, JavaScript, Three.js &amp; GSAP.</footer>

  <p id="a11y-status" class="sr-only" role="status" aria-live="polite"></p>

  <noscript>
    <p style="padding:6rem 1.5rem;color:#eef1fb;font-family:sans-serif;position:relative;z-index:2;">
      This portfolio needs JavaScript to show its content. Please enable JavaScript and reload.
    </p>
  </noscript>

  <!-- Pinned, exact versions from cdnjs. r128 of three.js is used throughout,
       so every three.js call below (Box/Cylinder/ConeGeometry, MeshStandardMaterial,
       HemisphereLight, Fog, etc.) targets that version's API on purpose.
       onerror flags a failed load so the page can fall back to the plain
       2D content view instead of showing a blank canvas if a CDN request
       ever fails. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.__portfolioLibFail=true"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="window.__portfolioLibFail=true"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" onerror="window.__portfolioLibFail=true"></script>

<script src="script.js"></script>
</body>
</html>
